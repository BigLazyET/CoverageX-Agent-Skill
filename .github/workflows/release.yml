name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace
        run: |
          set -euo pipefail
          test -f .agents/plugins/marketplace.json
          test -f .cursor-plugin/marketplace.json
          test -f plugins/coveragex-agent-skill/.codex-plugin/plugin.json
          test -f plugins/coveragex-agent-skill/.cursor-plugin/plugin.json
          test -f plugins/coveragex-agent-skill/skills/coveragex-incremental-report/SKILL.md
          test "$(find . -name SKILL.md -type f | wc -l | tr -d ' ')" = "1"
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .cursor-plugin/marketplace.json >/dev/null
          python3 -m json.tool plugins/coveragex-agent-skill/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/coveragex-agent-skill/.cursor-plugin/plugin.json >/dev/null
          python3 plugins/coveragex-agent-skill/skills/coveragex-incremental-report/scripts/verify_coverage_xml.py --self-test

      - name: Package marketplace
        run: |
          set -euo pipefail
          package="coveragex-agent-skill-${GITHUB_REF_NAME}"
          root="${RUNNER_TEMP}/CoverageX-Agent-Skill"
          mkdir -p "${root}"
          cp -R .agents .cursor-plugin .github plugins README.md LICENSE "${root}/"
          (cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/${package}.zip" CoverageX-Agent-Skill)
          sha256sum "${package}.zip" > "${package}.zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "coveragex-agent-skill-${GITHUB_REF_NAME}.zip" \
            "coveragex-agent-skill-${GITHUB_REF_NAME}.zip.sha256" \
            --generate-notes \
            --verify-tag
